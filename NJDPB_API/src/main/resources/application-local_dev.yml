spring:

  config:
    import: optional:file:.env-${spring.profiles.active}


  datasource:
    url: jdbc:h2:mem:testdb # For an in-memory database, or jdbc:h2:file:./data/testdb for a file-based database
    driver-class-name: org.h2.Driver
    username: sa
    password:  # Or leave blank for no password
  h2:
    console:
      enabled: true # Enables the H2 console for database management
      path: /h2-console # Optional: customize the console's path

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update # Controls schema generation (e.g., create, update, validate, none)

  security:
    user:
      name: ${SECURITY_USERNAME}
      password: ${SECURITY_PASSWORD}



#  cache:
#    type: redis
#    redis:
#      time-to-live: 50000 # Sets a 50seconds TTL (in milliseconds) for all Redis caches
#
#
#  redis:
#    host: ${REDIS_HOST}
#    port: ${REDIS_PORT}


  cache:
    type: none


logging:
  config: classpath:logback-spring-PUR_dev.xml

server:
  port: 8090
  servlet:
    context-path: /purchase/api/v1

management:
  endpoints:
    web:
      exposure:
        include: "*"
#        exclude: "env,beans"

spring:

  config:
    import: optional:file:.env-${spring.profiles.active}

  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=false;trustServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: ${SECURITY_USERNAME}
      password: ${SECURITY_PASSWORD}


  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:""}  # Default empty string if admin server is not available

cache:
  type: none


server:
  servlet:
    context-path: /api/v1


# logging:
#   config: classpath:logback-spring-retirement.xml


logging:
  structured:
    format:
      console: ecs


